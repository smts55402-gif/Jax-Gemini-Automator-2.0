name: Build Jax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source package
        shell: bash
        run: |
          set -e
          test -f "JAX_FINAL_CLEAN_PROJECT.zip"
          echo "Source ZIP found:"
          ls -lh "JAX_FINAL_CLEAN_PROJECT.zip"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/jax-project
          mkdir -p /tmp/jax-project

          unzip -q "JAX_FINAL_CLEAN_PROJECT.zip" -d /tmp/jax-project

          echo "Extracted files:"
          find /tmp/jax-project -maxdepth 3 -type f | head -100

          PROJECT_ROOT="$(find /tmp/jax-project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)"

          test -n "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Restore Android project
        shell: bash
        run: |
          set -e

          rm -rf app gradle
          rm -f build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties

          cp -a "$PROJECT_ROOT"/. ./

          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

          echo "Android project restored successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          echo "Java:"
          java -version
          echo "Gradle:"
          gradle --version
          echo "Project:"
          ls -la
          echo "App:"
          ls -la app

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"

          test -n "$APK"
          test -s "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jax-Gemini-Automator-2.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
